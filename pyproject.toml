[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-conformance-lab"
version = "0.1.0"
description = "Deterministic conformance, security, and regression testing for Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abdulaziz Alqudimi" }]
keywords = ["mcp", "model-context-protocol", "conformance", "security-testing", "regression-testing", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = [
  "anyio>=4.4,<5",
  "jsonschema>=4.23,<5",
  "mcp>=1.12,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
mcp-conformance = "mcp_conformance_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_conformance_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["mcp_conformance_lab"]
warn_unused_ignores = true
