schema_version: 1
name: fixture
transport:
  kind: stdio
  command: python3
  args:
    - examples/fixture_server.py
  allow_exec: true
  cwd: ..
policy:
  allow_exec: true
  inherit_environment: false
  connect_timeout_seconds: 10
  case_timeout_seconds: 5
  max_output_bytes: 1048576
  max_items: 1000
  fail_on: high
baseline: ../.mcp-lab/fixture-baseline.json
reports:
  directory: ../.mcp-lab/runs
  formats:
    - terminal
    - json
    - sarif
